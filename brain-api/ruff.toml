target-version = "py312"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "B008", # FastAPI relies on `Depends()` / `Query()` in argument defaults
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/tests/*" = ["S101"]
