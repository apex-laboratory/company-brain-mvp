services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: company_brain
      POSTGRES_USER: cb
      POSTGRES_PASSWORD: cb_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cb -d company_brain"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  brain-api:
    build: ./brain-api
    environment:
      DATABASE_URL: postgresql://cb:cb_secret@postgres/company_brain
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      SEMAPHORE_LIMIT: 5
      MCP_PORT: ${MCP_PORT:-8001}
      API_PORT: ${API_PORT:-8000}
    ports:
      - "${BRAIN_API_HOST_PORT:-8080}:8000"
      - "${BRAIN_MCP_HOST_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./brain-api:/app
      - ./source_authority.yaml:/app/source_authority.yaml:ro
    command: python main.py

volumes:
  pgdata:
